<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add Course - Accountant Portal</title>
    <link rel="icon" type="image/x-icon" href="static/images/Logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* --- Animations & Base Styles --- */
        @keyframes slideInFromTop {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .animate-slide-in { animation: slideInFromTop 0.6s ease-out; }
        .animate-fade-scale { animation: fadeInScale 0.5s ease-out; }

        .profile-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .nav-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .card-hover {
            transition: all 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        /* Form Styling */
        .form-input {
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.15);
            outline: none;
        }

        .form-readonly {
            background-color: #e5e7eb;
            color: #6b7280;
            cursor: not-allowed;
            border-color: #d1d5db;
        }

        .error-message {
            font-size: 0.875rem;
            color: #dc2626;
            margin-top: 0.5rem;
            padding: 0.75rem;
            background-color: #fee2e2;
            border-color: #fecaca;
            border-width: 1px;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 via-gray-100 to-gray-50 min-h-screen flex flex-col">

    <!-- Modern Navigation -->
    <nav class="bg-white nav-shadow sticky top-0 z-50 animate-slide-in">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo & Brand -->
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg profile-gradient flex items-center justify-center text-white font-bold text-lg shadow-md">
                        AC
                    </div>
                    <div class="hidden md:block">
                        <h1 class="text-lg font-bold text-gray-800">Accountant Portal</h1>
                        <p class="text-xs text-gray-500">Management Dashboard</p>
                    </div>
                </div>

                <!-- Center Navigation -->
                <div class="hidden lg:flex items-center gap-1">
                    <a href="accountant_home" class="px-4 py-2 text-sm font-medium text-gray-700 hover:text-purple-600 hover:bg-purple-50 rounded-lg transition-all duration-200">
                        Home
                    </a>
                    <a href="student_reg_accountant" class="px-4 py-2 text-sm font-medium text-gray-700 hover:text-purple-600 hover:bg-purple-50 rounded-lg transition-all duration-200">
                        Student Registration
                    </a>
                    <a href="show_students_accountant" class="px-4 py-2 text-sm font-medium text-purple-600 bg-purple-50 rounded-lg transition-all duration-200">
                        Student Data
                    </a>
                </div>

                <!-- Right Side -->
                <div class="flex items-center gap-4">
                    <div class="hidden md:flex items-center gap-2 px-3 py-2 bg-purple-50 rounded-lg">
                        <div class="w-8 h-8 rounded-full profile-gradient flex items-center justify-center text-white text-xs font-bold">
                            AC
                        </div>
                        <span class="text-sm font-medium text-gray-700">Accountant</span>
                    </div>
                    <a href="{{ url_for('logout') }}" class="px-4 py-2 bg-gradient-to-r from-red-500 to-red-600 text-white text-sm font-medium rounded-lg hover:from-red-600 hover:to-red-700 transition-all duration-200 shadow-md hover:shadow-lg">
                        Logout
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="flex-grow py-12 px-4 sm:px-6 lg:px-8 flex items-start justify-center">
        <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full animate-fade-scale overflow-hidden card-hover">

            <!-- Gradient Header -->
            <div class="profile-gradient p-6 relative">
                <div class="relative flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <div class="bg-white bg-opacity-20 p-2 rounded-lg backdrop-blur-sm">
                            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5s3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18s-3.332.477-4.5 1.253"></path>
                            </svg>
                        </div>
                        <div>
                            <h1 class="text-2xl font-bold text-white drop-shadow-lg">Enroll in Course</h1>
                            <p class="text-purple-100 text-sm">Add new course to student</p>
                        </div>
                    </div>
                    <a href="show_students_accountant" class="flex items-center gap-2 px-4 py-2 bg-white bg-opacity-20 hover:bg-opacity-30 text-white rounded-lg transition-all duration-200 text-sm font-medium backdrop-blur-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        Back
                    </a>
                </div>
            </div>

            <!-- Form Content -->
            <div class="p-8">
                <!-- Student Information Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-gray-50 p-4 rounded-lg border border-gray-200 mb-6">
                    <div>
                        <label for="txt2" class="block text-sm font-semibold text-gray-700 mb-2">Student ID:</label>
                        <input type="text" name="H1" value="{{ id }}" id="txt2" required readonly
                            class="form-input form-readonly w-full px-4 py-2.5 rounded-lg text-sm border-gray-300" />
                    </div>

                    <div>
                        <label for="txt3" class="block text-sm font-semibold text-gray-700 mb-2">Student Name:</label>
                        <input type="text" name="H2" value="{{ name }}" id="txt3" required readonly
                            class="form-input form-readonly w-full px-4 py-2.5 rounded-lg text-sm border-gray-300" />
                    </div>
                </div>

                <!-- Course Enrollment Form -->
                <form method="post" action="add_course1" class="space-y-6" onsubmit="return validateForm(event)">
                    <input type="hidden" name="T1" id="txt1" />

                    <!-- Course Selection -->
                    <div>
                        <label for="txt4" class="block text-sm font-semibold text-gray-700 mb-2">Course Name:</label>
                        <div class="relative">
                            <select name="T4" id="txt4" required
                                class="form-input w-full px-4 py-2.5 rounded-lg bg-white border border-gray-300 text-gray-900 focus:outline-none appearance-none">
                                <option disabled selected value="">Select a Course</option>
                                <option value="Web Development Fundamentals">Web Development Fundamentals</option>
                                <option value="Python Programming">Python Programming</option>
                                <option value="UI/UX Design">UI/UX Design</option>
                                <option value="Data Science & Analytics">Data Science & Analytics</option>
                                <option value="Database Management (SQL & NoSQL)">Database Management (SQL & NoSQL)</option>
                                <option value="Cloud Computing (AWS & Azure)">Cloud Computing (AWS & Azure)</option>
                                <option value="Full Stack Development">Full Stack Development</option>
                                <option value="Robotics Programming">Robotics Programming</option>
                                <option value="Artificial Intelligence (AI)">Artificial Intelligence (AI)</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
                                <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                            </div>
                        </div>
                    </div>

                    <!-- Course Fees Input -->
                    <div>
                        <label for="txt5" class="block text-sm font-semibold text-gray-700 mb-2">Course Fees (₹):</label>
                        <input type="number" name="T5" id="txt5" required min="0" placeholder="e.g., 15000"
                            class="form-input w-full px-4 py-2.5 rounded-lg bg-white border border-gray-300 text-gray-900 focus:outline-none" />
                        <small class="error-message hidden" id="feeError"></small>
                    </div>

                    <!-- Submit Button -->
                    <div class="pt-4 text-center">
                        <button type="submit" class="w-full md:w-auto bg-gradient-to-r from-purple-600 to-purple-700 text-white font-bold py-3 px-12 rounded-xl transition duration-300 transform hover:scale-[1.02] shadow-lg shadow-purple-500/50 hover:from-purple-700 hover:to-purple-800 flex items-center justify-center gap-2 mx-auto">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                            </svg>
                            Add Course to Student
                        </button>
                    </div>
                </form>

                <!-- Success/Error Message -->
                {% if msg %}
                    <div class="mt-8 p-4 rounded-xl text-center font-medium
                        {% if 'Added' in msg %}bg-green-100 text-green-700 border border-green-300
                        {% else %}bg-red-100 text-red-700 border border-red-300{% endif %}">
                        <h3 class="text-base sm:text-lg">{{ msg }}</h3>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-auto py-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center text-sm text-gray-600">
                <p class="font-medium">Accountant Portal • Confidential Information</p>
                <p class="text-xs text-gray-500 mt-1">© 2025 All rights reserved</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script>
        function validateForm(event) {
            const courseFeesInput = document.getElementById('txt5');
            const courseFees = parseFloat(courseFeesInput.value);
            const errorElement = document.getElementById('feeError');

            // Clear previous error
            errorElement.textContent = '';
            errorElement.classList.add('hidden');

            if (isNaN(courseFees) || courseFees < 0) {
                event.preventDefault();
                errorElement.textContent = 'Course fees must be a valid positive number.';
                errorElement.classList.remove('hidden');
                return false;
            }

            return true;
        }
    </script>
</body>
</html>
